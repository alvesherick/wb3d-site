<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Responsividade para dispositivos móveis -->

    <!-- Importa o CSS global -->
    <link rel="stylesheet" href="style.css">

    <!-- Importa o CSS específico da seção hero -->

    <!-- Título da página -->

<body>

    <!-- Seção Hero -->
    <section class="hero">

        <!-- Área dos textos -->
        <div class="hero-content">

            <!-- Texto pequeno acima do título -->
            <span class="hero-tag">
                ESCANEAMENTO • IMPRESSÃO • MODELAGEM
            </span>

            <!-- Título principal -->
            <h1>
                Da ideia à solução

            <!-- Container dos botões -->
            <div class="hero-buttons">

                    Solicitar orçamento

                <!-- Botão secundário -->
                <button class="btn-secondary" onclick="window.location.href='produtos.html'">
                    Ver produtos
                </button>

            </div>

        </div>

        <!-- Imagem do logo da direita -->
        <div class="hero-image">
            <img src="C:\Users\Raul\Downloads\teste site\wb3d-site\img\logo.png" alt="Logo de empresa WB3D">
